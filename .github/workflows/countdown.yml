name: Discord New Year Countdown

on:
  schedule:
    # Runs every 15 minutes on Dec 31 and Jan 1 (UTC)
    - cron: '*/15 * 31 12 *'
    - cron: '*/15 * 1 1 *'
  workflow_dispatch:

jobs:
  post-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check schedule and post to Discord
        env:
          WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK }}
          WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_2 }}
        run: |
          python3 - << 'EOF'
          import csv, os, urllib.request, json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Amsterdam"))
          current_date = now.strftime("%d-%m-%Y")
          minute_block = (now.minute // 15) * 15
          target_time = f"{now.hour:02d}:{minute_block:02d}"
          print(f"Checking for {current_date} {target_time} CET...")

          webhooks = [
              url for url in [os.environ.get("WEBHOOK_URL_1"), os.environ.get("WEBHOOK_URL_2")]
              if url and url.strip()
          ]

          with open("schedule.csv", mode="r", encoding="utf-8-sig") as f:
              sample = f.read(2048)
              f.seek(0)
              delimiter = ";" if sample.count(";") > sample.count(",") else ","
              reader = csv.DictReader(f, delimiter=delimiter)
              for row in reader:
                  row_date = (row.get("Datum (NL)") or "").strip()
                  row_time = (row.get("Tijd (NL)") or "").strip()
                  if row_date == current_date and row_time == target_time:
                      payload = json.dumps({
                          "content": row["Bericht (kopiëren naar Discord)"],
                          "allowed_mentions": {"parse": ["everyone"]}
                      }).encode("utf-8")
                      for i, url in enumerate(webhooks, start=1):
                          req = urllib.request.Request(
                              url.strip(),
                              data=payload,
                              headers={"Content-Type": "application/json", "User-Agent": "DiscordWebhook/1.0"}
                          )
                          urllib.request.urlopen(req)
                          nr = row.get("Nr", "?")
                          print(f"Sent message #{nr} to webhook #{i}")
          EOF
